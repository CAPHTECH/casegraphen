name: Fresh Agent Release Evaluation

on:
  workflow_dispatch:
    inputs:
      codex_model:
        description: Exact Codex model id
        required: true
        type: string
      claude_model:
        description: Exact Claude model id
        required: true
        type: string
      budget_usd:
        description: Maximum declared spend per provider lane
        required: true
        default: "25"
        type: string

jobs:
  prepare:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@3887e42e9fc0dcb4ce1d793231536d4a233d0979
        with:
          toolchain: 1.80.0
      - name: Build immutable evaluation bundle
        shell: bash
        run: |
          cargo build --release --locked --bin casegraphen
          mkdir -p fresh-agent-bundle/bin fresh-agent-bundle/scripts
          cp target/release/casegraphen fresh-agent-bundle/bin/casegraphen
          cp scripts/fresh-agent-eval.py fresh-agent-bundle/scripts/fresh-agent-eval.py
          cp -R evals skills schemas fresh-agent-bundle/
          python3 -m pip install --target fresh-agent-bundle/python-deps jsonschema==4.26.0
      - name: Publish immutable evaluation bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fresh-agent-evaluator-${{ github.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: fresh-agent-bundle
          if-no-files-found: error
          retention-days: 90

  evaluate:
    if: github.ref == 'refs/heads/main' && github.sha == vars.CASEGRAPHEN_TRUSTED_VERIFIER_SHA
    needs: prepare
    permissions:
      contents: read
    environment: fresh-agent-cli-session-${{ matrix.provider }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: codex
            runner_label: casegraphen-codex-cli-session
          - provider: claude
            runner_label: casegraphen-claude-cli-session
    runs-on: [self-hosted, linux, x64, casegraphen-fresh-agent, "${{ matrix.runner_label }}"]
    timeout-minutes: 240
    steps:
      - name: Download immutable evaluation bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: fresh-agent-evaluator-${{ github.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: fresh-agent-bundle
      - name: Prepare downloaded executable
        run: chmod 0755 fresh-agent-bundle/bin/casegraphen
      - name: Execute the Codex provider lane
        if: matrix.provider == 'codex'
        shell: bash
        env:
          CASEGRAPHEN_MODEL: ${{ inputs.codex_model }}
          CASEGRAPHEN_BUDGET_USD: ${{ inputs.budget_usd }}
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/fresh-agent-bundle/python-deps"
          python3 fresh-agent-bundle/scripts/fresh-agent-eval.py \
            --runner-profile codex \
            --auth-mode cli-session \
            --runner-package-identity '@openai/codex@0.146.0' \
            --expected-runner-version '0.146.0' \
            --model "$CASEGRAPHEN_MODEL" \
            --budget-usd "$CASEGRAPHEN_BUDGET_USD" \
            --timeout 900 \
            --casegraphen-bin "$GITHUB_WORKSPACE/fresh-agent-bundle/bin/casegraphen" \
            --output-dir fresh-agent-codex
      - name: Execute the Claude provider lane
        if: matrix.provider == 'claude'
        shell: bash
        env:
          CASEGRAPHEN_MODEL: ${{ inputs.claude_model }}
          CASEGRAPHEN_BUDGET_USD: ${{ inputs.budget_usd }}
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/fresh-agent-bundle/python-deps"
          python3 fresh-agent-bundle/scripts/fresh-agent-eval.py \
            --runner-profile claude \
            --auth-mode cli-session \
            --runner-package-identity '@anthropic-ai/claude-code@2.1.220' \
            --expected-runner-version '2.1.220' \
            --model "$CASEGRAPHEN_MODEL" \
            --budget-usd "$CASEGRAPHEN_BUDGET_USD" \
            --timeout 900 \
            --casegraphen-bin "$GITHUB_WORKSPACE/fresh-agent-bundle/bin/casegraphen" \
            --output-dir fresh-agent-claude
      - name: Publish raw and scored evidence
        id: provider_artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fresh-agent-${{ matrix.provider }}-${{ github.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: fresh-agent-${{ matrix.provider }}
          if-no-files-found: error
          retention-days: 90
      - name: Obtain proof from the external evaluation-host attestor
        if: success()
        shell: bash
        env:
          CASEGRAPHEN_EVALUATION_HOST_ATTESTOR: ${{ vars.CASEGRAPHEN_EVALUATION_HOST_ATTESTOR }}
          CASEGRAPHEN_EVALUATION_HOST_KEY_ID: ${{ vars.CASEGRAPHEN_EVALUATION_HOST_KEY_ID }}
          PROVIDER: ${{ matrix.provider }}
          PROVIDER_ARTIFACT_ID: ${{ steps.provider_artifact.outputs.artifact-id }}
          PROVIDER_ARTIFACT_DIGEST: ${{ steps.provider_artifact.outputs.artifact-digest }}
          PROVIDER_ARTIFACT_NAME: fresh-agent-${{ matrix.provider }}-${{ github.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          test -x "$CASEGRAPHEN_EVALUATION_HOST_ATTESTOR"
          [[ "$CASEGRAPHEN_EVALUATION_HOST_KEY_ID" =~ ^[A-Za-z0-9._:-]+$ ]]
          [[ "$PROVIDER_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          if [[ "$PROVIDER_ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]; then
            PROVIDER_ARTIFACT_DIGEST="sha256:$PROVIDER_ARTIFACT_DIGEST"
          fi
          [[ "$PROVIDER_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir -p evaluation-host-proof
          "$CASEGRAPHEN_EVALUATION_HOST_ATTESTOR" attest-fresh-agent \
            --provider "$PROVIDER" \
            --summary "fresh-agent-$PROVIDER/summary.json" \
            --signing-key-id "$CASEGRAPHEN_EVALUATION_HOST_KEY_ID" \
            --source-repository "$GITHUB_REPOSITORY" \
            --source-workflow "$GITHUB_WORKFLOW" \
            --source-workflow-path .github/workflows/fresh-agent-release-eval.yml \
            --source-run-id "$GITHUB_RUN_ID" \
            --source-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --source-head-ref "$GITHUB_REF" \
            --source-head-sha "$GITHUB_SHA" \
            --source-event "$GITHUB_EVENT_NAME" \
            --provider-artifact-id "$PROVIDER_ARTIFACT_ID" \
            --provider-artifact-name "$PROVIDER_ARTIFACT_NAME" \
            --provider-artifact-digest "$PROVIDER_ARTIFACT_DIGEST" \
            --output "evaluation-host-proof/$PROVIDER.json"
      - name: Publish evaluation-host proof separately from provider evidence
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fresh-agent-evaluation-host-proof-${{ matrix.provider }}-${{ github.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: evaluation-host-proof/${{ matrix.provider }}.json
          if-no-files-found: error
          retention-days: 90

  aggregate:
    if: always()
    needs: evaluate
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: fresh-agent-*-${{ github.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: fresh-agent-inputs
      - name: Build strict content-addressed matrix report
        id: aggregate
        continue-on-error: true
        run: |
          python3 scripts/fresh-agent-release.py \
            --runs-root fresh-agent-inputs \
            --output-dir fresh-agent-release-report
      - name: Publish matrix report and retained evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fresh-agent-release-report-${{ github.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: fresh-agent-release-report
          if-no-files-found: error
          retention-days: 90
      - name: Record the independent review seam
        if: steps.aggregate.outcome != 'success'
        run: |
          echo 'The strict matrix is incomplete or awaits a run-bound manual review.' >&2
          echo 'Provider evidence remains available for the separately trusted attestation, review, and finalization workflows.' >&2
