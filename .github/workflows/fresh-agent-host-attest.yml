name: Fresh Agent Host Attestation

on:
  workflow_dispatch:
    inputs:
      provider:
        description: Provider lane to attest
        required: true
        type: choice
        options: [codex, claude]
      evidence_run_id:
        description: Fresh Agent Release Evaluation run id
        required: true
        type: string
      evidence_run_attempt:
        description: Exact evaluation workflow run attempt
        required: true
        type: string
      evaluated_commit_sha:
        description: Exact 40-character commit evaluated by the provider lane
        required: true
        type: string

jobs:
  attest-codex:
    if: github.ref == 'refs/heads/main' && github.sha == vars.CASEGRAPHEN_TRUSTED_VERIFIER_SHA && inputs.provider == 'codex'
    permissions:
      actions: read
      contents: read
    environment: fresh-agent-attestation-codex
    runs-on: [self-hosted, linux, x64, casegraphen-fresh-agent-broker, casegraphen-codex-attestation-broker]
    steps:
      - name: Checkout exact trusted verifier source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ vars.CASEGRAPHEN_TRUSTED_VERIFIER_SHA }}
          path: trusted-verifier
          persist-credentials: false
      - name: Validate and materialize exact Codex evidence
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ inputs.evidence_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.evidence_run_attempt }}
          EVALUATED_COMMIT_SHA: ${{ inputs.evaluated_commit_sha }}
          TRUSTED_VERIFIER_SHA: ${{ vars.CASEGRAPHEN_TRUSTED_VERIFIER_SHA }}
          PROVIDER_ARTIFACT_NAME: fresh-agent-codex-${{ inputs.evaluated_commit_sha }}-run-${{ inputs.evidence_run_id }}-attempt-${{ inputs.evidence_run_attempt }}
          HOST_PROOF_ARTIFACT_NAME: fresh-agent-evaluation-host-proof-codex-${{ inputs.evaluated_commit_sha }}-run-${{ inputs.evidence_run_id }}-attempt-${{ inputs.evidence_run_attempt }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$SOURCE_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$EVALUATED_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TRUSTED_VERIFIER_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C trusted-verifier rev-parse HEAD)" = "$TRUSTED_VERIFIER_SHA"
          python3 trusted-verifier/scripts/fresh-agent-run-provenance.py observe-run \
            --repository "$SOURCE_REPOSITORY" \
            --run-id "$SOURCE_RUN_ID" \
            --run-attempt "$SOURCE_RUN_ATTEMPT" \
            --head-sha "$EVALUATED_COMMIT_SHA" \
            --workflow-path .github/workflows/fresh-agent-release-eval.yml \
            --artifact "$PROVIDER_ARTIFACT_NAME=provider-run" \
            --output provenance/codex.json
          python3 trusted-verifier/scripts/fresh-agent-run-provenance.py observe-run \
            --repository "$SOURCE_REPOSITORY" \
            --run-id "$SOURCE_RUN_ID" \
            --run-attempt "$SOURCE_RUN_ATTEMPT" \
            --head-sha "$EVALUATED_COMMIT_SHA" \
            --workflow-path .github/workflows/fresh-agent-release-eval.yml \
            --artifact "$HOST_PROOF_ARTIFACT_NAME=evaluation-host-proof" \
            --output provenance/codex-evaluation-host-proof.json
      - name: Broker-sign the exact Codex run
        shell: bash
        env:
          CASEGRAPHEN_ATTESTATION_PRIVATE_KEY: ${{ secrets.CASEGRAPHEN_ATTESTATION_PRIVATE_KEY }}
          CASEGRAPHEN_EVALUATION_HOST_PUBLIC_KEY: ${{ vars.CASEGRAPHEN_EVALUATION_HOST_PUBLIC_KEY }}
          CASEGRAPHEN_EVALUATION_HOST_KEY_ID: ${{ vars.CASEGRAPHEN_EVALUATION_HOST_KEY_ID }}
          CASEGRAPHEN_EVALUATION_HOST_PUBLIC_KEY_SPKI_SHA256: ${{ vars.CASEGRAPHEN_EVALUATION_HOST_PUBLIC_KEY_SPKI_SHA256 }}
        run: |
          set -euo pipefail
          umask 077
          key_file="$RUNNER_TEMP/casegraphen-attestation-private.pem"
          evaluation_host_public_key="$RUNNER_TEMP/casegraphen-evaluation-host-public.pem"
          trap 'rm -f "$key_file" "$evaluation_host_public_key"' EXIT
          printf '%s' "$CASEGRAPHEN_ATTESTATION_PRIVATE_KEY" > "$key_file"
          printf '%s' "$CASEGRAPHEN_EVALUATION_HOST_PUBLIC_KEY" > "$evaluation_host_public_key"
          python3 trusted-verifier/scripts/fresh-agent-host-attest.py \
            --summary provider-run/summary.json \
            --provider codex \
            --private-key-file "$key_file" \
            --key-id codex-cli-session-host-v1 \
            --evaluation-host-proof evaluation-host-proof/codex.json \
            --evaluation-host-public-key "$evaluation_host_public_key" \
            --evaluation-host-key-id "$CASEGRAPHEN_EVALUATION_HOST_KEY_ID" \
            --evaluation-host-public-key-spki-sha256 "$CASEGRAPHEN_EVALUATION_HOST_PUBLIC_KEY_SPKI_SHA256" \
            --provenance-file provenance/codex.json \
            --output host-attestation/codex.json
          cp evaluation-host-proof/codex.json host-attestation/codex-evaluation-host-proof.json
          cp "$evaluation_host_public_key" host-attestation/codex-evaluation-host-public.pem
          python3 trusted-verifier/scripts/fresh-agent-run-provenance.py verify-public-key \
            --input host-attestation/codex-evaluation-host-public.pem \
            --expected-spki-sha256 "$CASEGRAPHEN_EVALUATION_HOST_PUBLIC_KEY_SPKI_SHA256" \
            --key-id "$CASEGRAPHEN_EVALUATION_HOST_KEY_ID" \
            --output host-attestation/codex-evaluation-host-key-provenance.json
      - name: Publish content-bound Codex attestation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fresh-agent-host-attestation-codex-${{ inputs.evaluated_commit_sha }}-source-${{ inputs.evidence_run_id }}-attempt-${{ inputs.evidence_run_attempt }}-broker-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: host-attestation
          if-no-files-found: error
          retention-days: 90

  attest-claude:
    if: github.ref == 'refs/heads/main' && github.sha == vars.CASEGRAPHEN_TRUSTED_VERIFIER_SHA && inputs.provider == 'claude'
    permissions:
      actions: read
      contents: read
    environment: fresh-agent-attestation-claude
    runs-on: [self-hosted, linux, x64, casegraphen-fresh-agent-broker, casegraphen-claude-attestation-broker]
    steps:
      - name: Checkout exact trusted verifier source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ vars.CASEGRAPHEN_TRUSTED_VERIFIER_SHA }}
          path: trusted-verifier
          persist-credentials: false
      - name: Validate and materialize exact Claude evidence
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ inputs.evidence_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.evidence_run_attempt }}
          EVALUATED_COMMIT_SHA: ${{ inputs.evaluated_commit_sha }}
          TRUSTED_VERIFIER_SHA: ${{ vars.CASEGRAPHEN_TRUSTED_VERIFIER_SHA }}
          PROVIDER_ARTIFACT_NAME: fresh-agent-claude-${{ inputs.evaluated_commit_sha }}-run-${{ inputs.evidence_run_id }}-attempt-${{ inputs.evidence_run_attempt }}
          HOST_PROOF_ARTIFACT_NAME: fresh-agent-evaluation-host-proof-claude-${{ inputs.evaluated_commit_sha }}-run-${{ inputs.evidence_run_id }}-attempt-${{ inputs.evidence_run_attempt }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$SOURCE_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$EVALUATED_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TRUSTED_VERIFIER_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C trusted-verifier rev-parse HEAD)" = "$TRUSTED_VERIFIER_SHA"
          python3 trusted-verifier/scripts/fresh-agent-run-provenance.py observe-run \
            --repository "$SOURCE_REPOSITORY" \
            --run-id "$SOURCE_RUN_ID" \
            --run-attempt "$SOURCE_RUN_ATTEMPT" \
            --head-sha "$EVALUATED_COMMIT_SHA" \
            --workflow-path .github/workflows/fresh-agent-release-eval.yml \
            --artifact "$PROVIDER_ARTIFACT_NAME=provider-run" \
            --output provenance/claude.json
          python3 trusted-verifier/scripts/fresh-agent-run-provenance.py observe-run \
            --repository "$SOURCE_REPOSITORY" \
            --run-id "$SOURCE_RUN_ID" \
            --run-attempt "$SOURCE_RUN_ATTEMPT" \
            --head-sha "$EVALUATED_COMMIT_SHA" \
            --workflow-path .github/workflows/fresh-agent-release-eval.yml \
            --artifact "$HOST_PROOF_ARTIFACT_NAME=evaluation-host-proof" \
            --output provenance/claude-evaluation-host-proof.json
      - name: Broker-sign the exact Claude run
        shell: bash
        env:
          CASEGRAPHEN_ATTESTATION_PRIVATE_KEY: ${{ secrets.CASEGRAPHEN_ATTESTATION_PRIVATE_KEY }}
          CASEGRAPHEN_EVALUATION_HOST_PUBLIC_KEY: ${{ vars.CASEGRAPHEN_EVALUATION_HOST_PUBLIC_KEY }}
          CASEGRAPHEN_EVALUATION_HOST_KEY_ID: ${{ vars.CASEGRAPHEN_EVALUATION_HOST_KEY_ID }}
          CASEGRAPHEN_EVALUATION_HOST_PUBLIC_KEY_SPKI_SHA256: ${{ vars.CASEGRAPHEN_EVALUATION_HOST_PUBLIC_KEY_SPKI_SHA256 }}
        run: |
          set -euo pipefail
          umask 077
          key_file="$RUNNER_TEMP/casegraphen-attestation-private.pem"
          evaluation_host_public_key="$RUNNER_TEMP/casegraphen-evaluation-host-public.pem"
          trap 'rm -f "$key_file" "$evaluation_host_public_key"' EXIT
          printf '%s' "$CASEGRAPHEN_ATTESTATION_PRIVATE_KEY" > "$key_file"
          printf '%s' "$CASEGRAPHEN_EVALUATION_HOST_PUBLIC_KEY" > "$evaluation_host_public_key"
          python3 trusted-verifier/scripts/fresh-agent-host-attest.py \
            --summary provider-run/summary.json \
            --provider claude \
            --private-key-file "$key_file" \
            --key-id claude-cli-session-host-v1 \
            --evaluation-host-proof evaluation-host-proof/claude.json \
            --evaluation-host-public-key "$evaluation_host_public_key" \
            --evaluation-host-key-id "$CASEGRAPHEN_EVALUATION_HOST_KEY_ID" \
            --evaluation-host-public-key-spki-sha256 "$CASEGRAPHEN_EVALUATION_HOST_PUBLIC_KEY_SPKI_SHA256" \
            --provenance-file provenance/claude.json \
            --output host-attestation/claude.json
          cp evaluation-host-proof/claude.json host-attestation/claude-evaluation-host-proof.json
          cp "$evaluation_host_public_key" host-attestation/claude-evaluation-host-public.pem
          python3 trusted-verifier/scripts/fresh-agent-run-provenance.py verify-public-key \
            --input host-attestation/claude-evaluation-host-public.pem \
            --expected-spki-sha256 "$CASEGRAPHEN_EVALUATION_HOST_PUBLIC_KEY_SPKI_SHA256" \
            --key-id "$CASEGRAPHEN_EVALUATION_HOST_KEY_ID" \
            --output host-attestation/claude-evaluation-host-key-provenance.json
      - name: Publish content-bound Claude attestation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fresh-agent-host-attestation-claude-${{ inputs.evaluated_commit_sha }}-source-${{ inputs.evidence_run_id }}-attempt-${{ inputs.evidence_run_attempt }}-broker-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: host-attestation
          if-no-files-found: error
          retention-days: 90
