[package]
name = "casegraphen"
version = "0.8.0"
edition = "2021"
rust-version = "1.80"
description = "Structured case graph CLI for HigherGraphen."
authors = ["CAPH TECH Inc."]
license = "Apache-2.0"
repository = "https://github.com/CAPHTECH/casegraphen"
keywords = ["ai", "graph", "workflow", "reasoning", "cli"]
categories = ["development-tools", "data-structures", "command-line-utilities"]
# This repository's own agent tooling is not part of the product. It also
# contains a symlink into skills/, which cargo would otherwise materialize as a
# second copy of the shipped skill inside the published crate.
exclude = [".claude", ".github"]

[[bin]]
name = "casegraphen"
path = "src/main.rs"

[[bin]]
name = "casegraphen-mcp"
path = "src/bin/casegraphen-mcp.rs"

[dependencies]
higher-graphen-core = "0.7.1"
higher-graphen-structure = "0.7.1"
higher-graphen-reasoning = "0.7.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# ADR 0010: located strict-parse refusals. Measured delta: one crate beside
# the serde stack already present.
serde_path_to_error = "0.1"

# ADR 0009: property testing. Measured tree: 2 crates (arbtest, arbitrary).
[dev-dependencies]
arbtest = "0.3"

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
