[package]
name = "casegraphen"
version = "0.8.0"
edition = "2021"
rust-version = "1.80"
description = "Structured case graph CLI for HigherGraphen."
authors = ["CAPH TECH Inc."]
license = "Apache-2.0"
repository = "https://github.com/CAPHTECH/casegraphen"
keywords = ["ai", "graph", "workflow", "reasoning", "cli"]
categories = ["development-tools", "data-structures", "command-line-utilities"]

[[bin]]
name = "casegraphen"
path = "src/main.rs"

[dependencies]
higher-graphen-core = "0.7.1"
higher-graphen-structure = "0.7.1"
higher-graphen-reasoning = "0.7.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
